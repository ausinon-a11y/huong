    <!-- Window.fetch setter compatibility fix for sandboxed preview iframe & third-party tag managers -->

      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var originalFetch = window.fetch.bind(window);
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return originalFetch;
                },
                set: function(fn) {
                  originalFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return originalFetch;
                    },
                    set: function(fn) {
                      originalFetch = fn;
                    },
                    configurable: true,
                    enumerable: true
                  });
                } catch (e2) {}
              }
            }
          }
        } catch (e) {}
      })();
    </script>
